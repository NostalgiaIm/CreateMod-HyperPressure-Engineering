plugins {
    id("idea")
    id("eclipse")
    id("java-library")
    id("maven-publish")
    id("net.neoforged.moddev") version "2.0.141"
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            systemProperty("neoforge.enabledGameTestNamespaces", mod_id as String)
        }

        client {
            client()
        }

        server {
            server()
            programArgument("--nogui")
        }

        data {
            data()
            programArguments.addAll(
                "--mod", mod_id as String,
                "--all",
                "--output", file("src/generated/resources/").absolutePath,
                "--existing", file("src/main/resources/").absolutePath
            )
        }
    }
}

repositories {
    mavenLocal()
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://maven.neoforged.net/releases" }
    mavenCentral()
}

dependencies {
    def localCreateJar = file("libs/create-${minecraft_version}-${create_version}.jar")
    if (localCreateJar.exists() && localCreateJar.length() > 10_000_000) {
        implementation(files(localCreateJar))
    } else {
        implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
            transitive = false
        }
    }
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
}

sourceSets.main.resources {
    srcDir("src/generated/resources")
}

tasks.named("processResources", ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        neo_version            : neo_version,
        create_version         : create_version,
        flywheel_version_range : flywheel_version_range,
        ponder_version         : ponder_version,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_license            : mod_license,
        mod_description        : mod_description
    ]

    inputs.properties(replaceProperties)
    filesMatching(["META-INF/neoforge.mods.toml", "pack.mcmeta"]) {
        expand(replaceProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

jar {
    from("LICENSE") {
        rename { "${mod_id}-${it}" }
    }
}
